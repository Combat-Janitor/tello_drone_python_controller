name: Tello Drone Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-python-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linters
        run: pip install flake8 black
        
      - name: Run Black
        run: black --check --line-length 85 .

      - name: Run Flake8
        run: flake8 --max-line-length 85 .
